name: Build site

# Every push to main rebuilds the site and puts the finished files on the
# "live" branch. Hostinger deploys the "live" branch to public_html.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install markdown==3.9
      - run: python build.py
      - name: Publish to the live branch
        run: |
          cd public
          git init -q -b live
          git config user.name "site-build"
          git config user.email "site-build@users.noreply.github.com"
          git add -A
          git commit -q -m "Build from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" live
