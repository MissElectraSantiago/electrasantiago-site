.ess-wrap { max-width: 1200px; margin: 0 auto; padding-block: 48px 56px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

.ess-seg { display: inline-flex; border: 1px solid var(--ink); border-radius: 999px; overflow: hidden; }
.ess-seg button { height: 42px; padding: 0 14px; border: 0; background: transparent; color: var(--ink); font: inherit; font-size: 14px; cursor: pointer; }

.ess-chips { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

.ess-sort { display: inline-flex; gap: 14px; font-size: 14px; }

.ess-pick { position: relative; display: block; max-width: 420px; }

.ess-city { display: grid; grid-template-columns: minmax(0, 0.8fr) minmax(0, 1.6fr); gap: 20px 48px; padding: 36px 0; border-bottom: 1px solid var(--line); scroll-margin-top: 12px; }

.ess-evs { margin: 18px 0 0; padding: 14px 0 0; border-top: 1px solid var(--ink); list-style: none; display: grid; gap: 10px; }

.ess-ev { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; font-size: 14px; }

.ess-noev { margin: 18px 0 0; padding-top: 14px; border-top: 1px solid var(--line); font-size: 14px; color: var(--ink-soft); }

.ess-shops { min-width: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 32px; align-content: start; }

.ess-empty button { border: 0; background: none; padding: 0; color: var(--ink); text-decoration: underline; font: inherit; cursor: pointer; }

@media (prefers-reduced-motion: reduce) { .ess * { transition: none !important; } }
</style>

    $("ess-list").innerHTML = vis.map(function (v) {
      var h = v.h;
      var shops = v.shops.length ? v.shops.map(function (s) { return shopHtml(s, h); }).join("")
        : '<p class="ess-none">We couldn’t find a walk-in fetish shop we’d vouch for here yet.' + (h.nearest ? " " + esc(h.nearest) : "") + "</p>";
      return '<section class="ess-city" id="' + h.id + '" aria-labelledby="' + h.id + '-n">' +
        '<div class="ess-city-side"><h2 class="ess-city-name" id="' + h.id + '-n">' + esc(h.name) + '</h2><p class="ess-country">' + esc(h.country) +
        (h.shops.length ? " · " + h.shops.length + " shop" + (h.shops.length === 1 ? "" : "s") : "") + "</p>" + eventsHtml(h) + "</div>" +
        '<div class="ess-shops">' + shops + "</div></section>";
    }).join("");
  }
  render();
})();
</script>
